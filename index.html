<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Drone Commander: Swarm Light Show (Demo)</title><meta name="description" content="Free demo of Drone Commander: Swarm Light Show. Command a glowing drone swarm. Full version on itch.io."><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#050912;color:#dfe9ff;font:13px system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
.bar{display:flex;gap:6px;padding:6px 8px;flex-wrap:wrap;align-items:center}
#hud{justify-content:space-between;font-weight:600}
#demo{justify-content:space-between;background:#0d1730;border-top:1px solid #2c4a8a;border-bottom:1px solid #2c4a8a;font-weight:600}
#buy{background:#c2185b;border:1px solid #ff7aa8;color:#fff;border-radius:8px;padding:6px 10px;text-decoration:none;white-space:nowrap}
canvas{flex:1;min-height:0;width:100%;display:block;touch-action:none}
button{background:#13213f;color:#dfe9ff;border:1px solid #2c4a8a;border-radius:8px;padding:7px 9px;font-size:13px}
button.on{background:#2c6bff;border-color:#8fb0ff}
#burst{background:#c2185b;border-color:#ff7aa8}
input{width:90px}
select{background:#13213f;color:#dfe9ff;border:1px solid #2c4a8a;border-radius:8px;padding:7px 9px;font-size:13px}
</style></head><body>
<div class="bar" id="hud"><span id="m"></span><span id="s"></span></div>
<div class="bar" id="demo"><span>🎮 DEMO · 4 formations · up to 150 drones</span><a id="buy" href="https://alphazolozyro.itch.io/drone-commander-swarm-light-show" target="_blank" rel="noopener">Get the full game · $5.99</a></div>
<canvas id="c"></canvas>
<div class="bar" id="forms"></div>
<div class="bar"><button id="burst">💥 BURST</button><button id="l">⟲</button><button id="r">⟳</button><button id="mi">−</button><button id="pl">+</button><button id="col">🎨</button><button id="snd">🔊</button><select id="trk"></select><label>Drones <span id="n">60</span><input id="sl" type="range" min="10" max="150" value="60"></label></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),x=cv.getContext('2d');let W,H;
function rs(){W=cv.width=cv.clientWidth;H=cv.height=cv.clientHeight}
let N=60,form='circle',scale=1,rot=0,spin=0,pal=0,burst=0,score=0,hype=0,snd=true,AC,trk=0,mk=0;
let C={x:200,y:200},T={x:200,y:200},D=[],P=[];
function tone(f,d,ty='sine',v=.15,sl){if(!snd)return;try{AC=AC||new AudioContext();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start();o.stop(t+d)}catch(e){}}
const F={circle:(i,n)=>[Math.cos(i/n*6.283),Math.sin(i/n*6.283)],
heart:(i,n)=>{const t=i/n*6.283;return[Math.sin(t)**3,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/16]},
grid:(i,n)=>{const c=Math.ceil(Math.sqrt(n));return[((i%c)/c)*2-1,(Math.floor(i/c)/c)*2-1]},
arrow:(i,n)=>{const u=i/n;return u<.5?[u*4-1,0]:u<.75?[1-(u-.5)*4,(u-.5)*4]:[1-(u-.75)*4,-(u-.75)*4]}};
const PAL=[i=>`hsl(${i*360/N+performance.now()/20},100%,60%)`,()=>'#ffd34d',()=>'#4df0ff',()=>'#ff4dc8',()=>'#ff2e63'];
function fit(){while(D.length<N)D.push({x:C.x+Math.random()*40-20,y:C.y+Math.random()*40-20,vx:0,vy:0});D.length=N;$('n').textContent=N}
function setForm(f){if(f!==form){form=f;tone(520,.12,'triangle');hype=Math.min(100,hype+15)}build()}
function doBurst(){if(burst>0)return;burst=1.1;tone(160,.7,'sawtooth',.2,40);hype=Math.min(100,hype+25);D.forEach(d=>{const a=Math.random()*6.283,s=140+Math.random()*220;d.vx=Math.cos(a)*s;d.vy=Math.sin(a)*s})}
function build(){$('forms').innerHTML='';Object.keys(F).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className=k===form?'on':'';b.onclick=()=>setForm(k);$('forms').append(b)})}
function step(dt){rot+=spin*dt;C.x+=(T.x-C.x)*Math.min(1,dt*3);C.y+=(T.y-C.y)*Math.min(1,dt*3);
const R=Math.min(W,H)*.28*scale,cs=Math.cos(rot),sn=Math.sin(rot);
if(burst>0)burst-=dt;
D.forEach((d,i)=>{if(burst>0){d.vx*=1-1.6*dt;d.vy*=1-1.6*dt;if(Math.random()<.5)P.push({x:d.x,y:d.y,vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*30+20,l:1,c:PAL[pal](i)})}
else{const o=F[form](i,N),hx=C.x+(o[0]*cs-o[1]*sn)*R,hy=C.y+(o[0]*sn+o[1]*cs)*R;d.vx+=((hx-d.x)*14-d.vx*7.5)*dt;d.vy+=((hy-d.y)*14-d.vy*7.5)*dt}
d.x+=d.vx*dt;d.y+=d.vy*dt});
P.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt*1.1});P=P.filter(p=>p.l>0);
hype=Math.max(0,hype-6*dt);score+=hype*dt*.5}
function draw(){x.globalCompositeOperation='source-over';x.fillStyle='rgba(5,9,18,.25)';x.fillRect(0,0,W,H);
x.globalCompositeOperation='lighter';
P.forEach(p=>{x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.c;x.fillRect(p.x-1.5,p.y-1.5,3,3)});x.globalAlpha=1;
D.forEach((d,i)=>{const c=PAL[pal](i);x.fillStyle=c;x.globalAlpha=.18;x.beginPath();x.arc(d.x,d.y,8.3,0,6.283);x.fill();x.globalAlpha=1;x.beginPath();x.arc(d.x,d.y,3.2,0,6.283);x.fill()});
x.globalCompositeOperation='source-over';x.strokeStyle='#ffffff55';x.beginPath();x.arc(T.x,T.y,8,0,6.283);x.stroke();
$('m').textContent='🎆 Light Show · '+(fps|0)+'fps';$('s').textContent=`Score ${score|0} · Hype ${hype|0}%`}
let last=performance.now();let fps=60;function loop(n){const dt=Math.min(.12,(n-last)/1000||.016);last=n;fps+=(1/Math.max(dt,.001)-fps)*.1;const k=Math.ceil(dt/.02);for(let i=0;i<k;i++)step(dt/k);draw();requestAnimationFrame(loop)}
const pp=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
cv.onpointerdown=e=>{if(AC)AC.resume();cv.setPointerCapture(e.pointerId);T=pp(e)};
cv.onpointermove=e=>{if(!e.buttons)return;T=pp(e)};
$('snd').onclick=()=>{snd=!snd;$('snd').textContent=snd?'🔊':'🔇'};
const TR=[{n:'🌹 Romantic',sc:[262,330,392,494,523,659],w:'sine',ms:520},{n:'⚡ Epic',sc:[196,233,294,349,392,466],w:'sawtooth',ms:260},{n:'🌊 Chill',sc:[220,262,330,392,440],w:'triangle',ms:600},{n:'🎉 Party',sc:[262,294,392,440,523,588],w:'square',ms:210},{n:'🔇 No music'}];
TR.forEach((t,i)=>{const o=document.createElement('option');o.value=i;o.textContent=t.n;$('trk').append(o)});
$('trk').onchange=e=>{trk=+e.target.value};
document.addEventListener('pointerdown',()=>{if(AC)AC.resume()});
(function music(){const t=TR[trk];if(t.sc){const g=t.w==='square'||t.w==='sawtooth'?.5:1;tone(t.sc[(mk++*3+(mk>>2))%t.sc.length]*(mk%7==0?.5:1),t.ms/1000*1.3,t.w,(.03+hype/2500)*g)}setTimeout(music,t.ms||400)})();
$('burst').onclick=doBurst;$('l').onclick=()=>spin=spin<=-1?0:spin-1;$('r').onclick=()=>spin=spin>=1?0:spin+1;
$('mi').onclick=()=>scale=Math.max(.3,scale-.2);$('pl').onclick=()=>scale=Math.min(3.5,scale+.2);
$('col').onclick=()=>pal=(pal+1)%PAL.length;$('sl').oninput=e=>{N=+e.target.value;fit()};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase(),s=40;if(k=='w')T.y-=s;if(k=='s')T.y+=s;if(k=='a')T.x-=s;if(k=='d')T.x+=s;if(k=='q')spin=-1;if(k=='e')spin=1;if(k=='x')spin=0;if(k==' '){e.preventDefault();doBurst()}});
addEventListener('resize',rs);rs();C={x:W/2,y:H/2};T={...C};fit();build();requestAnimationFrame(loop);
</script></body></html>
